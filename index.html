<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLM v0.0.1</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0b0b16;
    --panel: rgba(255,255,255,0.04);
    --border: rgba(255,255,255,0.08);
    --text: #e8e8f0;
    --muted: #8a8aa0;
    --accent: #7c5cff;
    --accent2: #4cc9f0;
  }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "SF Pro Display", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(1200px 800px at 20% -10%, #2a1a5e 0%, transparent 60%),
      radial-gradient(1000px 700px at 110% 110%, #0d3b5c 0%, transparent 55%),
      var(--bg);
    color: var(--text);
    display: flex; align-items: center; justify-content: center;
    padding: 20px; overflow: hidden;
  }
  .app {
    position: relative;
    width: min(720px, 100%);
    height: min(780px, calc(100vh - 40px));
    display: flex; flex-direction: column;
    background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
    border: 1px solid var(--border);
    border-radius: 24px;
    backdrop-filter: blur(24px);
    box-shadow: 0 30px 80px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06);
    overflow: hidden;
  }
  .app::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(124,92,255,0.8), rgba(76,201,240,0.8), transparent);
  }
  header {
    padding: 18px 22px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--border); gap: 12px;
  }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .logo {
    flex-shrink: 0; width: 38px; height: 38px; border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: grid; place-items: center;
    font-weight: 800; font-size: 12px; letter-spacing: 0.5px;
    box-shadow: 0 6px 18px rgba(124,92,255,0.45);
  }
  .title { font-size: 15px; font-weight: 600; }
  .subtitle {
    font-size: 11px; color: var(--muted); margin-top: 2px;
    font-family: ui-monospace, monospace;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 320px;
  }
  .actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .quota {
    font-size: 12px; color: var(--muted);
    padding: 6px 12px; border-radius: 999px;
    border: 1px solid var(--border); background: rgba(255,255,255,0.03);
    white-space: nowrap;
  }
  .quota b { color: var(--text); font-weight: 600; }
  .ghost {
    padding: 7px 14px; font-size: 12px;
    background: transparent; border: 1px solid var(--border);
    color: var(--muted); border-radius: 10px;
    cursor: pointer; font-family: inherit; font-weight: 500;
    transition: color .2s, border-color .2s;
  }
  .ghost:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }
  main {
    flex: 1; overflow-y: auto; padding: 22px;
    display: flex; flex-direction: column; gap: 12px;
  }
  main::-webkit-scrollbar { width: 6px; }
  main::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
  .msg {
    max-width: 78%; padding: 11px 15px; border-radius: 18px;
    font-size: 14px; line-height: 1.55;
    animation: fadeUp 0.28s ease both;
    word-wrap: break-word; white-space: pre-wrap;
  }
  .msg.user {
    align-self: flex-end;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: white; border-bottom-right-radius: 6px;
    box-shadow: 0 8px 22px rgba(124,92,255,0.3);
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--panel); border: 1px solid var(--border);
    border-bottom-left-radius: 6px;
  }
  .msg.meta {
    align-self: flex-start; font-size: 12px; color: var(--muted);
    padding: 4px 6px; background: transparent; border: none; max-width: 90%;
  }
  .typing { display: inline-flex; gap: 4px; align-items: center; padding: 4px 2px; }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%; background: var(--muted);
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  footer {
    padding: 16px; border-top: 1px solid var(--border);
    display: flex; gap: 10px; background: rgba(0,0,0,0.15);
  }
  input {
    flex: 1; background: rgba(255,255,255,0.05);
    border: 1px solid var(--border); border-radius: 14px;
    padding: 13px 16px; color: var(--text); font-size: 14px;
    outline: none; font-family: inherit;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  input:focus {
    border-color: rgba(124,92,255,0.6);
    box-shadow: 0 0 0 3px rgba(124,92,255,0.15);
  }
  input::placeholder { color: var(--muted); }
  input:disabled { opacity: 0.5; cursor: not-allowed; }
  button {
    padding: 0 22px; border: none; border-radius: 14px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: white; font-size: 14px; font-weight: 600;
    cursor: pointer; font-family: inherit;
    transition: transform 0.15s, opacity 0.15s;
    box-shadow: 0 8px 20px rgba(124,92,255,0.35);
  }
  button:hover { transform: translateY(-1px); }
  button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  #toast {
    position: fixed; bottom: 28px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(20,20,35,0.95);
    border: 1px solid var(--border);
    padding: 12px 20px; border-radius: 14px;
    font-size: 13px; color: var(--text);
    opacity: 0; pointer-events: none;
    transition: all 0.3s ease;
    backdrop-filter: blur(12px); z-index: 10; max-width: 90vw;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes blink {
    0%, 80%, 100% { opacity: 0.3; transform: translateY(0); }
    40% { opacity: 1; transform: translateY(-3px); }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo">LLM</div>
      <div>
        <div class="title">LLM v0.0.2</div>
        <div class="subtitle">build: 永远beta · 装了 5 亿参数，终于能答一点了</div>
      </div>
    </div>
    <div class="actions">
      <div class="quota">模型额度 <b id="quota">20</b>/20</div>
      <button class="ghost" id="endBtn">结束对话</button>
    </div>
  </header>
  <main id="chat"></main>
  <footer>
    <input id="input" placeholder="问点什么：算个题、换算单位、或者随便聊聊…（输入「退出」可结束）" autocomplete="off" />
    <button id="send">发送</button>
  </footer>
</div>
<div id="toast"></div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const quotaEl = document.getElementById('quota');
const toastEl = document.getElementById('toast');
const endBtn = document.getElementById('endBtn');

const state = { ended: false, busy: false };
const sleep = ms => new Promise(r => setTimeout(r, ms));

function toast(text) {
  toastEl.textContent = text;
  toastEl.classList.add('show');
  clearTimeout(toastEl._t);
  toastEl._t = setTimeout(() => toastEl.classList.remove('show'), 2400);
}

function addMsg(text, kind = 'bot') {
  const el = document.createElement('div');
  el.className = 'msg ' + kind;
  el.textContent = text;
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
  return el;
}

function addTyping() {
  const el = document.createElement('div');
  el.className = 'msg bot';
  el.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
  return el;
}

async function ensureBridge() {
  // 浏览器模式（python main.py --web）下没有 pywebview，直接走 fetch
  if (location.protocol === 'http:' || location.protocol === 'https:') return;
  while (!window.pywebview || !window.pywebview.api) await sleep(50);
}

async function callApi(name, ...args) {
  if (window.pywebview && window.pywebview.api) return window.pywebview.api[name](...args);
  const res = await fetch('/api/' + name, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ args })
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

async function handle(raw) {
  if (state.ended || state.busy) return;
  const prompt = (raw || '').trim();
  if (!prompt) { addMsg("检测到空提问，请输入内容！", 'bot'); return; }

  addMsg(prompt, 'user');
  input.value = '';
  state.busy = true;
  sendBtn.disabled = true;

  await ensureBridge();
  const thinking = addTyping();
  let result;
  try {
    result = await callApi('chat', prompt);
  } catch (e) {
    thinking.remove();
    addMsg("Python 后端异常：" + e, 'meta');
    state.busy = false;
    sendBtn.disabled = false;
    return;
  }
  thinking.remove();

  for (const item of result) {
    const kind = item[0];
    const text = item[1];

    if (kind === '__END__') { state.ended = true; continue; }

    if (kind === '__delay__') {
      const typing = addTyping();
      await sleep(parseFloat(text) * 1000);
      typing.remove();
      continue;
    }

    addMsg(text, kind);
  }

  const q = await callApi('quota');
  quotaEl.textContent = Math.max(0, q.limit - q.count);

  state.busy = false;
  if (!state.ended) {
    sendBtn.disabled = false;
    input.focus();
  } else {
    endBtn.disabled = true;
    input.placeholder = "对话已结束，请重新启动（同样繁忙）";
    toast("对话已结束 · JSON 报告已由 Python 输出");
  }
}

sendBtn.addEventListener('click', () => handle(input.value));
endBtn.addEventListener('click', () => handle('退出'));
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.isComposing) {
    e.preventDefault();
    handle(input.value);
  }
});

addMsg("使用本服务即表示您同意：本模型有权在没把握的时候说不知道。", 'meta');
addMsg("你好，我是 LLM v0.0.2。算术、单位换算、记事儿、还有点常识——这次可能真答得上来。", 'bot');
input.focus();
</script>
</body>
</html>
